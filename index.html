      </nav>
      <div class="acciones">

        <div class="estado-carga"><span class="punto"></span></div>
      </main>
    </div>
  </div>

      <button class="boton-icono" id="visorCerrar" aria-label="Cerrar visor" data-icono="cerrar"></button>

      <span class="paginas" id="visorPaginas"></span>
      <button class="boton-icono ocultar-movil" id="visorAlejar" aria-label="Alejar" data-icono="menos"></button>
